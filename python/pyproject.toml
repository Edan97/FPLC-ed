[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn-export"
version = "0.1.0"
description = "Read Cytiva UNICORN 6/7 result exports (.zip) without UNICORN: curves, events, peaks and method"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
unicorn-export = "unicorn_export.cli:main"

[tool.setuptools]
packages = ["unicorn_export"]
